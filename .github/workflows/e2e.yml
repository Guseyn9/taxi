name: E2E

# The same Playwright tests used locally, run automatically against the live backend.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: playwright-e2e-live-backend
  queue: max
  cancel-in-progress: false

jobs:
  e2e:
    # Draft review stacks must not create trips on the shared live backend.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Both live workflows serialize access to the shared test driver/vehicle.
    # queue:max retains up to 100 waiting runs instead of replacing one pending run.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taxi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: taxi/package.json
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_PASSENGER_PHONE: ${{ secrets.E2E_PASSENGER_PHONE }}
          E2E_PICKUP_QUERY: ${{ vars.E2E_PICKUP_QUERY }}
          E2E_PICKUP_MATCH: ${{ vars.E2E_PICKUP_MATCH }}
          E2E_DESTINATION_QUERY: ${{ vars.E2E_DESTINATION_QUERY }}
          E2E_DESTINATION_MATCH: ${{ vars.E2E_DESTINATION_MATCH }}
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_DRIVER2_TYPE: ${{ secrets.E2E_DRIVER2_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}

      - name: Check report privacy
        id: privacy
        if: always()
        run: node tools/check-private-report.cjs
        env:
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}

      - name: Upload Playwright artifacts
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            taxi/playwright-report/
            taxi/e2e-results/results.json
          retention-days: 7
          if-no-files-found: ignore
