name: E2E

# Тот же Playwright-тест, что и локально (`npm run test:e2e`), но запускаемый
# автоматически. Отдельной CI-реализации сценария нет — см. taxi/e2e/README.md
on:
  pull_request:
  push:
    branches:
      - main

# Тесты идут против живого backend и делят одного тестового водителя и его
# машину. Общая очередь на весь репозиторий не даёт двум прогонам встретиться
# на одном аккаунте.
concurrency:
  group: playwright-e2e-live-backend
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Потолок против зависания: 4 теста с ретраем плюс npm ci, установка
    # Chromium и первая сборка dev-server.
    timeout-minutes: 60
    defaults:
      run:
        # Корневого package.json нет: весь Node-проект живёт в taxi/.
        working-directory: taxi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из требований проекта: engines.node в taxi/package.json.
          node-version-file: taxi/package.json
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      # Воспроизводимая установка по lockfile, а не npm install.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        # workers: 1 и retries: 1 приходят из playwright.config.ts по CI —
        # флагами здесь не дублируются, чтобы источник правды был один.
        run: npm run test:e2e
        env:
          # Приложение поднимает сам Playwright (webServer: npm start).
          E2E_APP_URL: http://localhost:3000
          # Учётные данные только отсюда: ни одного значения в коде и в этом файле.
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}

      # always() — чтобы был виден и прогон, прошедший только со второй попытки.
      # На результат job не влияет: continue-on-error здесь нет нигде.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          # taxi/e2e/.auth/ с токенами сессии сюда сознательно не входит.
          path: |
            taxi/playwright-report/
            taxi/e2e-results/
          retention-days: 7
          if-no-files-found: ignore
