name: E2E

# The same Playwright tests used locally, run automatically against the live backend.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

# Shared live backend and test accounts: one E2E run at a time.
# GitHub keeps one running and one pending run per group. A newer commit
# replaces an obsolete pending run, while the running test is never cancelled.
concurrency:
  group: taxi-live-backend-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # Draft review stacks must not create trips on the shared live backend.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Playwright E2E
    runs-on: ubuntu-latest
    # The live backend uses a shared test driver and vehicle. GitHub concurrency
    # groups retain only one pending run and replace older pending runs, so they
    # cannot provide a lossless queue. Each run instead waits for its turn below.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taxi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: taxi/package.json
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_DRIVER2_TYPE: ${{ secrets.E2E_DRIVER2_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            taxi/playwright-report/
            taxi/e2e-results/
          retention-days: 7
          if-no-files-found: ignore
