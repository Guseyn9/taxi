name: E2E

# The same Playwright tests used locally, run automatically against the live backend.
on:
  pull_request:
  push:
    branches:
      - main

# Keep at most one running and one pending E2E run per PR.
# A newer commit replaces an older pending run for the same PR, but never
# interrupts a run that is already using the shared backend.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # The live backend uses shared test accounts, so all PRs still take turns
    # through the global queue below. Per-PR concurrency prevents queue buildup
    # from every intermediate commit.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taxi

    steps:
      - name: Wait for this run's turn against the shared backend
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${REPOSITORY}/actions/workflows/e2e.yml/runs?per_page=100"
          echo "Waiting for an exclusive turn against the shared E2E backend."

          while true; do
            # Do not spend a queue slot testing a commit superseded by a newer
            # commit in the same PR.
            if [[ -n "${PR_NUMBER}" ]]; then
              latest_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
              if [[ "${latest_sha}" != "${CURRENT_HEAD_SHA}" ]]; then
                echo "Skipping stale E2E run: ${CURRENT_HEAD_SHA}; current PR head is ${latest_sha}."
                exit 0
              fi
            fi

            runs="$(gh api "${api}")"
            earliest="$(jq -r '[.workflow_runs[] | select(.status != "completed") | .run_number] | min // empty' <<< "${runs}")"
            current_number="$(jq -r --arg id "${CURRENT_RUN_ID}" '.workflow_runs[] | select((.id | tostring) == $id) | .run_number' <<< "${runs}")"

            if [[ -z "${current_number}" ]]; then
              echo "Could not find current workflow run in GitHub API response." >&2
              exit 1
            fi

            if [[ "${current_number}" == "${earliest}" ]]; then
              # Close the small race between acquiring the turn and starting
              # the test when a newer PR commit was pushed.
              if [[ -n "${PR_NUMBER}" ]]; then
                latest_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
                if [[ "${latest_sha}" != "${CURRENT_HEAD_SHA}" ]]; then
                  echo "Skipping stale E2E run after queue acquisition."
                  exit 0
                fi
              fi
              echo "Acquired E2E turn for run ${CURRENT_RUN_ID} (run number ${current_number})."
              break
            fi

            echo "Run ${current_number} is waiting; earliest unfinished run is ${earliest}. Checking again in 15 seconds."
            sleep 15
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: taxi/package.json
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_DRIVER2_TYPE: ${{ secrets.E2E_DRIVER2_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            taxi/playwright-report/
            taxi/e2e-results/
          retention-days: 7
          if-no-files-found: ignore
