name: Refresh npm lockfile (temporary)

on:
  push:
    branches:
      - feat/passenger-web-voice
    paths:
      - .github/workflows/refresh-npm-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate npm lockfile
        working-directory: taxi
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        working-directory: taxi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-npm-lock.yml
          git add taxi/package-lock.json .github/workflows/refresh-npm-lock.yml
          git commit -m "fix: synchronize taxi npm lockfile"
          git push origin HEAD:feat/passenger-web-voice
