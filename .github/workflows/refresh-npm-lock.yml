name: Refresh npm lockfile (temporary)

on:
  push:
    branches:
      - feat/passenger-web-voice
    paths:
      - .github/workflows/refresh-npm-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate npm lockfile
        working-directory: taxi
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-taxi-package-lock
          path: taxi/package-lock.json
          if-no-files-found: error
          retention-days: 1
