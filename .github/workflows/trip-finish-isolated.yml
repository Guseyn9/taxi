name: TEST-E2E-010 isolated stability

on:
  pull_request:
    branches:
      - main
    paths:
      - 'taxi/e2e/trip-finish.spec.ts'
      - 'taxi/playwright.config.ts'
      - 'taxi/e2e/fixtures/**'
      - '.github/workflows/trip-finish-isolated.yml'
  workflow_dispatch:

# Shares the same live test accounts/backend as the full E2E workflow.
# Do not run either workflow concurrently against those accounts.
concurrency:
  group: playwright-e2e-live-backend
  cancel-in-progress: false

jobs:
  trip-finish:
    name: TEST-E2E-010 isolated run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        run: [1, 2, 3]
    defaults:
      run:
        working-directory: taxi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: taxi/package.json
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TEST-E2E-010 once, without retry
        run: npm run test:e2e -- --project=trip-finish --retries=0
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_DRIVER_LOGIN: ${{ secrets.E2E_DRIVER_LOGIN }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_DRIVER_TYPE: ${{ secrets.E2E_DRIVER_TYPE }}
          E2E_DRIVER2_LOGIN: ${{ secrets.E2E_DRIVER2_LOGIN }}
          E2E_DRIVER2_PASSWORD: ${{ secrets.E2E_DRIVER2_PASSWORD }}
          E2E_DRIVER2_TYPE: ${{ secrets.E2E_DRIVER2_TYPE }}
          E2E_PASSENGER_LOGIN: ${{ secrets.E2E_PASSENGER_LOGIN }}
          E2E_PASSENGER_PASSWORD: ${{ secrets.E2E_PASSENGER_PASSWORD }}
          E2E_PASSENGER_TYPE: ${{ secrets.E2E_PASSENGER_TYPE }}
